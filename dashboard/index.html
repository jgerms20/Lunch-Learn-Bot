<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10131a" />
  <title>Lunch & Learn | AgencyThings</title>
  <link rel="stylesheet" href="/dashboard/styles.css" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="https://jgerms20.github.io/AgencyThings/"><i data-lucide="arrow-left"></i><span>Joshua's AgencyThings</span></a>
    <div class="title"><strong>Lunch & Learn</strong><span>Programming desk</span></div>
    <div class="topbar-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme"><i data-lucide="sun"></i><span data-theme-label>Light mode</span></button>
      <button class="primary" type="button" data-open-planner><i data-lucide="calendar-plus"></i>Plan a session</button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="nav-rail">
      <nav aria-label="Lunch and Learn sections">
        <button class="active" data-view="today"><i data-lucide="calendar-days"></i>Today</button>
        <button data-view="pipeline"><i data-lucide="list-todo"></i>Pipeline</button>
        <button data-view="partners"><i data-lucide="users"></i>Partners</button>
        <button data-view="contacts"><i data-lucide="user"></i>Contacts</button>
        <button data-view="calendar"><i data-lucide="calendar"></i>Calendar</button>
        <button data-view="templates"><i data-lucide="files"></i>Templates</button>
        <button data-view="archive"><i data-lucide="archive"></i>Archive</button>
      </nav>
      <div class="rail-photo"><img src="/dashboard/assets/lunch-learn-session.png" alt="Colleagues learning together over lunch" /><span>Build a program people make time for.</span></div>
    </aside>
    <main class="workspace">
      <section class="filters"><label><i data-lucide="search"></i><input type="search" data-search placeholder="Search partners, contacts, topics, next actions" /></label><select data-vertical-filter><option value="all">All verticals</option></select><p data-status role="status">Program data loaded.</p></section>
      <section data-main-view aria-live="polite"><div class="loading">Loading the programming desk…</div></section>
    </main>
    <aside class="insight-rail" data-insight-rail></aside>
  </div>

  <dialog class="planner-dialog" data-planner-dialog>
    <form method="dialog" data-planner-form>
      <header><div><span>New session</span><h2>Plan a Lunch & Learn</h2></div><button value="cancel" aria-label="Close planner"><i data-lucide="x"></i></button></header>
      <div class="form-grid"><label>Partner<input name="company" required placeholder="Partner or guest" /></label><label>Topic<input name="topic" required placeholder="What will the agency learn?" /></label><label>Date<input type="date" name="date" required /></label><label>Time<input type="time" name="time" value="12:00" /></label><label>Format<select name="format"><option>In-Person</option><option>Virtual</option><option>Hybrid</option></select></label><label>Audience<input name="audience" placeholder="All agency, Strategy, Creative…" /></label><label class="wide">Location / link<input name="location" placeholder="Room, studio, or meeting link" /></label></div>
      <footer><button value="cancel">Cancel</button><button class="primary" value="default" data-save-session>Save session</button></footer>
    </form>
  </dialog>
  <dialog class="template-dialog" data-template-dialog><article><header><h2 data-template-title>Template</h2><button aria-label="Close template" data-close-template><i data-lucide="x"></i></button></header><pre data-template-content></pre><footer><button class="primary" data-copy-template><i data-lucide="clipboard"></i>Copy template</button></footer></article></dialog>
  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
